<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-container register-layout">

    <section class="auth-image">
      <img src="images/ironman-register.png" alt="Iron Man">
    </section>

    <section class="register-content">
      <h1 class="register-title">Create An Account</h1>

      <form id="registerForm" class="register-form" novalidate>

        <div class="auth-card register-card">

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
            <small class="error-message" id="fullNameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper has-icon">
              <span class="input-icon">✉</span>
              <input type="email" id="email" name="email" placeholder="yourname@gmail.com">
            </div>
            <small class="error-message" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password">
              <button type="button" class="toggle-password" data-target="password">👁</button>
            </div>
            <small class="error-message" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password">
              <button type="button" class="toggle-password" data-target="confirmPassword">👁</button>
            </div>
            <small class="error-message" id="confirmPasswordError"></small>
          </div>

          <div class="form-group">
            <label class="remember terms">
              <input type="checkbox" id="terms" name="terms">
              I agree to the <a href="#" class="link">terms of service</a> and <a href="#" class="link">privacy policy</a>
            </label>
            <small class="error-message" id="termsError"></small>
          </div>

        </div>

        <div class="register-actions">
          <button type="submit" class="btn-primary">Create Account</button>
          <p class="switch-text">
            Already have an account?
            <a href="login.html" class="link">Sign in Now</a>
          </p>
        </div>

      </form>
    </section>

  </main>

  <script src="js/register.js"></script>
</body>
</html>
